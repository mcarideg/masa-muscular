<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doneday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}html,body{background:#050505}</style>
<title>Doneday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone planner — week header, day strip, content panel, fixed bottom tabs */
:root{
  --bg:#050505; --surface:rgba(255,255,255,0.045); --solid:#111111; --ink:#F2F2F2; --muted:#8C8C8C; --line:rgba(255,255,255,0.10);
  --accent:#FFFFFF; --on-accent:#0A0A0A; --accent-soft:rgba(255,255,255,0.12); --mark:#FFFFFF;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --c-estudios:#F5F5F5; --c-trabajo:#A3A3A3; --c-proyecto:#D6C7A1; --c-personal:#6B6B6B;
  --display:"Geist",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:"Geist",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"Geist",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{min-height:100vh;min-height:100dvh}
body{background:transparent}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#161616 0px,#0C0C0C 180px,transparent 420px),radial-gradient(90% 45% at 15% 25%,rgba(30,30,30,.45) 0%,transparent 70%),var(--bg);transform:translateZ(0)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,.now-t,.sum b{letter-spacing:-.02em}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk{min-width:0;border:0;background:transparent;padding:0;text-align:left}
.wk small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.today-btn{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}

/* day strip */
.days{touch-action:pan-y;user-select:none;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.month{font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize;padding:2px 4px 0}
.back{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}
.day{border:0;background:transparent;border-radius:17px;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.day span{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day.is-today{background:#FFFFFF}
.day.is-today b{color:#6B6B6B}
.day.is-today span{color:#0A0A0A;font-weight:700}
.day.is-today .load{background:rgba(0,0,0,.12)}
.day.is-today .load i{background:#0A0A0A}
.day.is-today .load.full i{background:#D92D3A}
.day[aria-pressed="true"]:not(.is-today){background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.day[aria-pressed="true"]:not(.is-today) b{color:var(--ink)}
.load{width:20px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.load i{display:block;height:100%;background:#BDBDBD;border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.load.full i{background:var(--bad)}

/* sections */
.panel{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.sec-head .meta{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);width:46px;flex:none;font-variant-numeric:tabular-nums;line-height:1.3}
.bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:8px;flex:none}
.del:hover{background:var(--bg);color:var(--bad)}
.empty{padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}

.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.28);flex:none;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{transition:color .3s ease}
.done .t{color:var(--muted)}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.p-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-mute{background:var(--bg);color:var(--muted)}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.prio.alta{background:var(--bad)} .prio.media{background:var(--warn)} .prio.baja{background:var(--muted)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* goals */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.prog .num{background:linear-gradient(100deg,#FFFFFF 10%,#7A7A7A 95%);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.prog .num small{font-size:16px;font-weight:600;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-left:6px}
.track{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:12px 16px;border-radius:12px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px}
.banner button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}

/* FAB + bottom tabs */
.fab-slot{display:grid;place-items:center}
.tabs .fab{width:52px;height:52px;padding:0;border-radius:17px;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;font-weight:300;line-height:1;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.55);margin-top:-8px}
*{-webkit-tap-highlight-color:transparent}
:focus{outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,[data-edit]:focus-visible{outline:2px solid rgba(255,255,255,.55)!important;outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#050505;border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tabs button{border:0;background:transparent;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--solid);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet h3{font-family:var(--display);font-size:20px;margin:0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select{font:inherit;color:var(--ink);background:#1A1A1A;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.err{color:var(--bad);font-size:13px}
.sync{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-top:18px;letter-spacing:.04em}
.list,.prog,.stat{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.prog .track{background:rgba(255,255,255,.08)}
.prog .track i{background:linear-gradient(90deg,#FFFFFF,#8C8C8C)}
.now{background:var(--surface);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.now small{font-size:12px;color:var(--muted);font-weight:600}
.now-t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;background:linear-gradient(100deg,#FFFFFF 10%,#8A8A8A 95%);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.now .s{font-size:13px;color:var(--muted)}
.num-b{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.num-b.first{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.meta.over{color:var(--warn)}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.warnbox b{color:var(--warn);font-weight:600}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:#1A1A1A;border-radius:14px;padding:12px 14px}
.choice b{font-weight:600}.choice span{font-size:13px;color:var(--muted)}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.sumrow{display:grid;grid-template-columns:1fr 1fr}
.sum+.sum{border-left:1px solid var(--line);padding-left:14px}
.sum b{display:block;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;background:linear-gradient(100deg,#FFFFFF 10%,#8A8A8A 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sum b.bad{background:none;-webkit-text-fill-color:var(--bad);color:var(--bad)}
.sum span{font-size:12px;color:var(--muted)}
.sumcard .track{height:6px;background:rgba(255,255,255,.08)}
.sumcard .track i{background:linear-gradient(90deg,#FFFFFF,#8C8C8C)}
.qa-in{display:flex;gap:8px;align-items:center;background:#1A1A1A;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:6px 6px 6px 14px}
.qa-in input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:8px 0;outline:none}
.qa-go{width:38px;height:38px;border-radius:11px;border:0;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;flex:none}
.k{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ch{position:relative;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#C9C9C9;cursor:pointer}
.ch.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.ch input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.toast{font-size:13px;color:var(--ok);margin:4px 2px 0;min-height:1.2em}
.toast.bad{color:var(--bad)}
.qa-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.linkbtn{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 0}
.tap{cursor:pointer}
.linkbtn.danger{color:var(--bad)}
.opt{font-weight:400;color:var(--muted)}
.dch{width:38px;padding:7px 0;text-align:center}
#bDays{gap:5px}
.chips .linkbtn{padding:4px 8px 4px 0;font-size:12px}
.daybar{display:flex;flex-direction:column;gap:6px}
.db-head{display:flex;justify-content:space-between;align-items:baseline;border:0;background:transparent;padding:0 2px;font-size:13px;font-weight:500;color:var(--muted)}
.db-head b{color:var(--ink);font-weight:600}
.chev{display:inline-block;font-style:normal;transform:rotate(90deg);margin-left:4px;transition:transform .25s var(--ease)}.chev.up{transform:rotate(-90deg)}
.db-track{position:relative;display:block;height:40px;width:100%;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow:hidden;padding:0}
.seg-b{position:absolute;top:4px;bottom:4px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}
.seg-b em{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.db-past{position:absolute;left:0;top:0;bottom:0;background:rgba(5,5,5,.55);pointer-events:none}
.db-ticks{position:relative;height:16px;margin-top:2px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.db-ticks .now-tk{color:var(--bad);font-weight:600}
.db-ticks span{position:absolute;transform:translateX(-50%)}
.db-ticks span.l{transform:none}.db-ticks span.r{transform:translateX(-100%)}
.db-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column}
.db-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.db-row .time{width:auto;flex:none;line-height:1}.db-row .t{flex:1;min-width:0;font-weight:600;font-size:14px}
.db-list .linkbtn{align-self:flex-start}
.swr{position:relative;overflow:hidden}
.swr+.swr .row{border-top:1px solid var(--line)}
.swr .row{position:relative;background:#0F0F0F;touch-action:pan-y}
.sw-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;font-weight:700;color:var(--muted)}
.swr[data-dir="r"] .sw-bg{background:color-mix(in srgb,var(--ok) 18%,#0F0F0F)}.swr[data-dir="r"] .sw-bg span:last-child{visibility:hidden}
.swr[data-dir="l"] .sw-bg{background:color-mix(in srgb,var(--warn) 18%,#0F0F0F)}.swr[data-dir="l"] .sw-bg span:first-child{visibility:hidden}
.swr.armed[data-dir="r"] .sw-bg{color:var(--ok)}.swr.armed[data-dir="l"] .sw-bg{color:var(--warn)}
[data-drag]{touch-action:none;cursor:grab;user-select:none}
.swr.dragging{z-index:3;overflow:visible}
.swr.dragging .row{background:#1C1C1C;box-shadow:0 10px 30px rgba(0,0,0,.6);border-radius:12px}
.day.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.hint{font-size:12px;color:var(--muted);margin:-4px 2px 0;line-height:1.4}
.rec-ic{width:24px;text-align:center;color:var(--muted);flex:none}
.brief-k{font-size:12px;font-weight:600;color:var(--muted)}
.brief-sum{margin:0;color:var(--muted)}.brief-sum b{color:var(--ink)}.brief-sum .bad{color:var(--bad)}
.part{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.ic{width:13px;height:13px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 4px 0 0}
.s .ic:last-child:not(:first-child){margin:0 0 0 5px}
.db-wrap{position:relative}
.now-line{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bad);pointer-events:none;box-shadow:0 0 8px color-mix(in srgb,var(--bad) 60%,transparent)}
/* motion */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
/* PrepTrack-style motion: short, soft, staggered */
#panel.in-f>*{animation:inF .3s var(--ease) both}
#panel.in-l>*{animation:inL .25s var(--ease) both}
#panel.in-r>*{animation:inR .25s var(--ease) both}
#panel>*:nth-child(2){animation-delay:.04s}#panel>*:nth-child(3){animation-delay:.08s}#panel>*:nth-child(4){animation-delay:.12s}#panel>*:nth-child(5){animation-delay:.16s}#panel>*:nth-child(n+6){animation-delay:.2s}
.days.in-l,.days.in-r{animation:inF .28s var(--ease)}
@keyframes inF{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.scrim:not([hidden]){animation:fadeIn .22s ease}
.scrim:not([hidden]) .sheet{animation:sheetUp .32s var(--ease)}
.scrim.closing{animation:fadeOut .22s ease forwards}
.scrim.closing .sheet{animation:sheetDown .22s ease-in forwards}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes sheetDown{to{transform:translateY(100%)}}
.day span{transition:background-color .25s var(--ease),color .25s var(--ease),transform .2s var(--ease)}
.day{transition:background-color .25s var(--ease),box-shadow .25s var(--ease)}

<script>
const DAYS=["L","M","X","J","V","S","D"];
const DAYS_LONG=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const CATS={estudios:"Estudios",trabajo:"Prácticas / trabajo",proyecto:"Proyecto",personal:"Personal"};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);

// ---------- dates ----------
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtShort=s=>{const d=parse(s);return `${(d.getDay()+6)%7>=0?DAYS_LONG[(d.getDay()+6)%7].slice(0,3).toLowerCase():""} ${d.getDate()} ${MONTHS[d.getMonth()]}`};

// ---------- planner ----------
const SIZE={rapida:0.5,media:1.5,larga:4};
const SIZE_L={rapida:"Rápida",media:"Media",larga:"Larga"};
const PRIO_N={alta:0,media:1,baja:2};
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const fmtH=h=>{let m=Math.round(h*60);if(m>=60)m=Math.round(m/5)*5;if(m<60)return `${Math.max(1,m)} min`;const H=Math.floor(m/60),M=m%60;return M?`${H} h ${M} min`:`${H} h`};
function dayWin(){const st=S.settings||{};const a=toMin(st.wake||"09:00");let b=toMin(st.sleep||"21:00");if(b<=a)b=Math.min(1440,a+60);return [a,b]}
function freeHours(d){
  const dow=(parse(d).getDay()+6)%7,[A,B]=dayWin(),W1=B,nw=new Date();
  const W0=d===iso(nw)?Math.min(W1,Math.max(A,nw.getHours()*60+nw.getMinutes())):A;
  let busy=0;S.schedule.filter(b=>b.day===dow).forEach(b=>{busy+=Math.max(0,Math.min(W1,toMin(b.end))-Math.max(W0,toMin(b.start)))});
  return Math.max(0,(W1-W0-busy)/60);
}
const capacity=d=>Math.min(6,Math.floor(freeHours(d)*0.6*2)/2);
const logged=t=>Object.values(t.log||{}).reduce((a,b)=>a+b,0);
const hrs=t=>t.hours||SIZE[t.size||"media"];
const sizeLbl=t=>t.hours?(t.est?"~":"")+fmtH(t.hours):"~45 min";
const remaining=t=>Math.max(0,hrs(t)-logged(t));
const doneToday=t=>(t.log&&t.log[iso(new Date())])||0;
function plan(){
  const today=iso(new Date()),P={},used={},unfit=[],first={};
  used[today]=S.tasks.reduce((a,t)=>a+doneToday(t),0);
  for(const t of S.tasks){
    if(t.done||remaining(t)<=0.01||!t.pin)continue;
    const d=t.pin<today?today:t.pin,h=remaining(t);
    (P[d]=P[d]||[]).push({t,h,part:1,parts:1});used[d]=(used[d]||0)+h;first[t.id]=d;
  }
  const pend=S.tasks.filter(t=>!t.done&&remaining(t)>0.01&&!t.pin).sort((a,b)=>
    (a.due<today?today:a.due).localeCompare(b.due<today?today:b.due)||PRIO_N[a.prio]-PRIO_N[b.prio]||hrs(b)-hrs(a));
  for(const t of pend){
    let rem=remaining(t),d=today;const last=t.due<today?today:t.due,chunks=[];
    while(rem>0.01&&d<=last){
      const cap=capacity(d)-(used[d]||0);
      if(cap>=0.5||cap>=rem-0.01&&cap>0){const h=Math.min(rem,cap);chunks.push({d,h});used[d]=(used[d]||0)+h;rem-=h}
      d=iso(addDays(parse(d),1));
    }
    if(rem>0.01){unfit.push(t);const c=chunks.find(c=>c.d===last);if(c)c.h+=rem;else chunks.push({d:last,h:rem});used[last]=(used[last]||0)+rem}
    chunks.forEach((c,i)=>{(P[c.d]=P[c.d]||[]).push({t,h:c.h,part:i+1,parts:chunks.length})});
    first[t.id]=chunks[0].d;
  }
  const ord=S.order||{},ix=(o,id)=>{const i=o.indexOf(id);return i<0?999:i};
  for(const d in P)if(ord[d])P[d].sort((a,b)=>ix(ord[d],a.t.id)-ix(ord[d],b.t.id));
  return {P,unfit,first,used};
}
let PL={P:{},unfit:[],first:{},used:{}};

// recurring tasks: templates in S.recurring, one task per day created up to 7 days ahead
function materialize(){
  if(!S.recurring||!S.recurring.length)return false;
  const today=iso(new Date());let ch=false;S.recMade=S.recMade||{};
  const before=S.tasks.length;
  S.tasks=S.tasks.filter(t=>!(t.recId&&!t.done&&t.pin<today&&logged(t)===0));
  if(S.tasks.length!==before)ch=true;
  for(let i=0;i<7;i++){
    const d=iso(addDays(new Date(),i)),dow=(parse(d).getDay()+6)%7;
    for(const r of S.recurring){
      const key=r.id+"|"+d;
      if(!r.days.includes(dow)||S.recMade[key]||(r.from&&d<r.from))continue;
      S.recMade[key]=1;ch=true;
      S.tasks.push({id:uid(),recId:r.id,title:r.title,due:d,pin:d,prio:r.prio,hours:r.hours,est:r.est,rule:r.rule,units:r.units,userTime:r.userTime,cat:"personal",done:false,log:{}});
    }
  }
  for(const k in S.recMade){if(k.split("|")[1]<iso(addDays(new Date(),-30)))delete S.recMade[k]}
  return ch;
}
const daysTxt=days=>{const d=[...days].sort();if(d.length===7)return "Todos los días";if(d.join()==="0,1,2,3,4")return "Lunes a viernes";if(d.join()==="5,6")return "Fines de semana";return d.map(i=>DAYS_LONG[i].slice(0,3).toLowerCase()).join(", ")};

// ---------- state ----------
function exampleState(){
  const mon=monday(new Date()), t=iso(new Date());
  const d=n=>iso(addDays(new Date(),n));
  return {example:true,
    schedule:[
      {id:uid(),day:0,start:"09:00",end:"14:00",title:"Clase",cat:"estudios"},
      {id:uid(),day:1,start:"09:00",end:"14:00",title:"Clase",cat:"estudios"},
      {id:uid(),day:2,start:"09:00",end:"14:00",title:"Clase",cat:"estudios"},
      {id:uid(),day:3,start:"09:00",end:"14:00",title:"Clase",cat:"estudios"},
      {id:uid(),day:2,start:"16:00",end:"18:00",title:"Bloque de proyecto",cat:"proyecto"},
      {id:uid(),day:4,start:"10:00",end:"13:00",title:"Prácticas",cat:"trabajo"},
      {id:uid(),day:5,start:"11:00",end:"12:30",title:"Gimnasio",cat:"personal"}],
    tasks:[
      {id:uid(),title:"Trabajo de estadística",due:d(1),prio:"alta",size:"larga",cat:"estudios",done:false},
      {id:uid(),title:"Enviar CV actualizado",due:d(2),prio:"alta",size:"rapida",cat:"trabajo",done:false},
      {id:uid(),title:"Contestar correos pendientes",due:d(2),prio:"baja",size:"rapida",cat:"personal",done:false},
      {id:uid(),title:"Repasar contabilidad tema 4",due:d(3),prio:"media",size:"media",cat:"estudios",done:false},
      {id:uid(),title:"Presentación del proyecto",due:d(5),prio:"media",size:"larga",cat:"proyecto",done:false},
      {id:uid(),title:"Compra semanal",due:t,prio:"baja",size:"rapida",cat:"personal",done:true}],
    goals:{[iso(mon)]:[
      {id:uid(),text:"Ir 3 días al gimnasio",done:false},
      {id:uid(),text:"Tener al día estadística",done:true},
      {id:uid(),text:"Avanzar 6 h en el proyecto",done:false}]}};

  const gaps=[];let c=start;

  ["planchar",/plancha/i,15,6],["lavadora",/lavadora/i,5],["tender",/tender/i,10],["doblar",/doblar|guardar ropa/i,10],
  ["fregar",/fregar|platos|lavavajillas/i,15],["aspirar",/aspirar|barrer|fregona/i,20],["limpiar",/limpi|ordenar/i,30],["basura",/basura|reciclaje/i,5],

  ["pagar",/pagar|recibo|factura|banco/i,10],["cita",/m[eé]dico|dentista|cita|peluquer/i,60],
  ["gimnasio",/gimnasio|gym|entrenar|entreno/i,75],["correr",/correr|running/i,45],
  ["cv",/\bcv\b|curr[ií]culum/i,30],["entrevista",/entrevista/i,60],["reunion",/reuni[oó]n|quedar/i,60],
  ["examen",/examen/i,180],["estudiar",/estudiar/i,120,60],["repasar",/repasar|repaso/i,60,40],
  ["leer",/leer|lectura/i,45,2],["apuntes",/apuntes|resumen|esquema/i,60],["ejercicios",/ejercicio|deberes|tarea de/i,60,10],

  ["trabajo",/trabajo|proyecto|entrega/i,180],
];
function estimateLocal(title){
  const n=(title.match(/\b(\d{1,3})\b/)||[])[1];
  for(const[key,re,base,per] of RULES){
    if(!re.test(title))continue;
    const learned=S.learn&&S.learn[key];
    let min=learned?learned.min:base;
    if(n&&per)min=(learned&&learned.per?learned.per:per)*(+n);
    return {hours:Math.min(8,Math.max(5,min)/60),rule:key,units:n&&per?+n:null};
  }

}

}

}

  if(t.dataset.qpin){qa.pin=t.dataset.qpin==="auto"?null:t.dataset.qpin;qa.panel=null;return renderChips()}
  if(t.dataset.delrec){const rid=t.dataset.delrec;S.recurring=(S.recurring||[]).filter(r=>r.id!==rid);S.tasks=S.tasks.filter(v=>!(v.recId===rid&&!v.done));closeSheet();dropExample();return commit()}
  if(t.id==="briefOk")return closeSheet();
  if(t.id==="qaClose")return closeSheet();
  if(t.id==="prevW"){view.week=iso(addDays(parse(view.week),-7));return render()}
  if(t.id==="nextW"){view.week=iso(addDays(parse(view.week),7));return render()}
  if(t.id==="goToday"){const dir=view.week>iso(monday(new Date()))?"r":"l";view.week=iso(monday(new Date()));view.day=(new Date().getDay()+6)%7;return render(dir)}
  if(t.id==="clearEx"){S={schedule:[],tasks:[],goals:{}};return commit()}
  if(t.id==="carry"){
    const next=iso(addDays(parse(view.week),7));
    const pend=weekGoals().filter(x=>!x.done);
    S.goals[next]=(S.goals[next]||[]).concat(pend.map(x=>({id:uid(),text:x.text,done:false})));

  }
  if(t.dataset.day){if(swiped)return;const nd=+t.dataset.day,dir=nd>view.day?"l":nd<view.day?"r":"f";if(nd===view.day&&view.tab==="dia")return;view.day=nd;const ch=view.tab!=="dia";view.tab="dia";return render(ch?"f":dir)}

  if(t.id==="foldRec"){view.showRec=!view.showRec;return render()}
  if(t.dataset.task){const x=S.tasks.find(v=>v.id===t.dataset.task);if(!x)return;
    const fin=()=>{vtNext=true;if(t.checked){x.doneAt=Date.now();markSeg(x,remaining(x))}else unSeg(x);x.done=t.checked;if(!t.checked)x.log={};dropExample();commit()};

    return fin()}
  if(t.classList&&t.classList.contains("chk")){t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop")}
  if(t.dataset.chunk){const id=t.dataset.chunk,h=+t.dataset.h;t.disabled=true;return animateMove(t.closest(".swr"),()=>completeChunk(id,h),"done")}
  if(t.dataset.undo){const x=S.tasks.find(v=>v.id===t.dataset.undo);if(!x)return;t.disabled=true;return animateMove(t.closest(".row"),()=>{vtNext=true;delete x.log[iso(new Date())];unSeg(x);x.done=false;dropExample();commit()},"undo")}
  if(t.dataset.add){view.addKind=t.dataset.add;return openSheet()}
  if(t.dataset.goal){const x=weekGoals().find(v=>v.id===t.dataset.goal);if(x){x.done=t.checked;dropExample();commit()}return}
  if(t.dataset.deltask){S.tasks=S.tasks.filter(v=>v.id!==t.dataset.deltask);dropExample();return commit()}
  if(t.dataset.delblock){S.schedule=S.schedule.filter(v=>v.id!==t.dataset.delblock);dropExample();return commit()}
  if(t.dataset.delgoal){S.goals[view.week]=weekGoals().filter(v=>v.id!==t.dataset.delgoal);dropExample();return commit()}
});

// ---------- row gestures: swipe to complete / postpone, drag to reorder or move day ----------
let suppressClick=false;const quietClick=()=>{suppressClick=true;setTimeout(()=>suppressClick=false,80)};
// Tareas tab: mark the row, then let it glide to its new group (no collapse)
function animateMove(el,done,mode){
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return done();
  el.classList.add(mode==="undo"?"unchecking":"completing");setTimeout(done,90);

// FLIP: remember where things were, update, then glide them from old to new place
const FLIP_SEL=[".list",".swr",".list>.row",".sec-head",".grp-h",".folds",".empty-line",".tsum",".daybar",".now",".warnbox"].map(x=>"#panel "+x).join(",");
function flipFirst(){const byEl=new Map(),byKey=new Map(),oldClone=new Map(),zero=new Set(),oldList=new Map();
  document.querySelectorAll(FLIP_SEL).forEach(el=>{const r=el.getBoundingClientRect();if(!r.width&&!r.height){zero.add(el);return}byEl.set(el,r);if(el.dataset.sw){byKey.set(el.dataset.sw,r);oldClone.set(el.dataset.sw,el.cloneNode(true));oldList.set(el.dataset.sw,el.closest(".list"))}});return {byEl,byKey,oldClone,zero,oldList}}
function flipPlay(F){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const moves=[],now=new Map(),ghosts=[];
  const els=[...document.querySelectorAll(FLIP_SEL)];
  els.forEach(el=>{if(F.byEl.get(el)||(el.dataset.sw&&F.byKey.get(el.dataset.sw))){el.classList.remove("m-in");for(let up=el.parentElement;up&&up.id!=="panel";up=up.parentElement)up.classList.remove("m-in")}});
  els.forEach(el=>now.set(el,el.getBoundingClientRect()));
  for(const el of els){
    const old=F.byEl.get(el)||(el.dataset.sw&&F.byKey.get(el.dataset.sw));if(!old)continue;
    el.classList.remove("m-in");
    const nr=now.get(el);
    if(!F.byEl.get(el)){
      // moved to another group: fly a floating copy above everything, so no list clips it
      for(let up=el.parentElement;up&&up.id!=="panel";up=up.parentElement)up.classList.remove("m-in");
      ghosts.push([el,old,nr]);continue;
    }
    let dy=old.top-nr.top;
    const isList=el.classList.contains("list");
    if(!isList){const L=el.parentElement&&el.parentElement.closest(".list");if(L&&F.byEl.get(L))dy-=F.byEl.get(L).top-now.get(L).top}
    const dh=isList&&old.height>0?nr.height-old.height:0;
    if(Math.abs(dy)<1&&Math.abs(dh)<1)continue;
    moves.push([el,dy,dh,old.height,nr.height]);
  }
  for(const [el,old,nr] of ghosts){
    const wrap=document.createElement("div");wrap.className="list flip-ghost";
    const cl=el.cloneNode(true);wrap.appendChild(cl);
    const oc=F.oldClone.get(el.dataset.sw);
    if(oc){oc.classList.remove("completing","unchecking","collapse");oc.style.cssText="position:absolute;left:0;right:0;top:0;margin:0;transition:opacity .16s ease;opacity:1";oc.querySelector(".sw-bg")?.remove();wrap.appendChild(oc);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{oc.style.opacity="0"}))}
    const first=!el.previousElementSibling,last=!el.nextElementSibling;
    if(!first){const rr=cl.classList.contains("row")?cl:cl.querySelector(".row");if(rr)rr.style.borderTop="1px solid var(--line)"}
    const endR=`${first?14:0}px ${first?14:0}px ${last?14:0}px ${last?14:0}px`;
    Object.assign(wrap.style,{position:"fixed",left:(nr.left-1)+"px",top:(nr.top-1)+"px",width:(nr.width+2)+"px",margin:"0",zIndex:"40",pointerEvents:"none",transform:`translateY(${old.top-nr.top}px)`,transition:"none",willChange:"transform"});
    document.body.appendChild(wrap);el.style.visibility="hidden";
    // a brand-new group holding only this card: hide its empty box until the card lands
    const L=el.parentElement&&el.parentElement.closest(".list");
    const hideL=L&&!F.byEl.get(L)&&[...L.children].every(c=>ghosts.some(g=>g[0]===c));if(hideL)L.style.visibility="hidden";
    // flies as a card and melts into the list row as it arrives
    requestAnimationFrame(()=>requestAnimationFrame(()=>{wrap.style.transition="transform .38s cubic-bezier(.33,1,.68,1),border-color .24s ease .1s,border-radius .24s ease .1s";wrap.style.transform="translateY(0)";wrap.style.borderColor="transparent";wrap.style.borderRadius=endR}));
    const land=()=>{if(!wrap.isConnected)return;el.style.visibility="";if(hideL)L.style.visibility="";wrap.remove()};
    setTimeout(land,400);
  }
  const LBL=el=>el.classList.contains("grp-h")||el.classList.contains("empty-line")||el.classList.contains("sec-head")||el.classList.contains("warnbox");
  for(const [el,r] of F.byEl){
    if(!el.isConnected||!LBL(el)||r.height<1)continue;const n=now.get(el);if(n&&(n.width||n.height))continue;
    const c=el.cloneNode(true);c.removeAttribute("hidden");c.classList.remove("m-in");
    Object.assign(c.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",margin:"0",zIndex:"39",pointerEvents:"none",transition:"opacity .2s ease",opacity:"1"});
    document.body.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.opacity="0"}));setTimeout(()=>c.remove(),260);
  }
  for(const el of F.zero||[]){
    if(!el.isConnected)continue;const n=now.get(el);if(!n||(!n.width&&!n.height))continue;
    if(el.classList.contains("list")&&el.style.visibility==="hidden")continue;
    el.classList.remove("m-in");el.style.transition="none";el.style.opacity="0";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition="opacity .24s ease .12s";el.style.opacity="";setTimeout(()=>{el.style.transition=""},420)}));
  }
  for(const [el,r] of F.byEl){
    if(el.isConnected||el.classList.contains("list")||el.dataset.sw||r.height<1)continue;
    if(!(el.classList.contains("grp-h")||el.classList.contains("empty-line")||el.classList.contains("sec-head")||el.classList.contains("warnbox")))continue;
    Object.assign(el.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",margin:"0",zIndex:"39",pointerEvents:"none",transition:"opacity .2s ease",opacity:"1"});
    el.classList.remove("m-in");document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.opacity="0"}));setTimeout(()=>el.remove(),260);
  }
  // rows left behind in the list a card leaves slide over the departing card (never text on text)
  const src=new Set(ghosts.map(g=>F.oldList&&F.oldList.get(g[0].dataset.sw)).filter(L=>L&&L.isConnected&&!ghosts.some(g=>g[0].closest(".list")===L)));
  src.forEach(L=>{L.style.position="relative";L.style.zIndex="41";setTimeout(()=>{L.style.position="";L.style.zIndex=""},450)});
  for(const [el,dy,dh] of moves){el.style.transition="none";el.style.willChange="transform";el.style.transform=`translateY(${dy}px)`;
    if(dh>1)el.style.clipPath=`inset(0 0 ${dh}px 0 round 14px)`;
    if(!el.classList.contains("list")){el.style.position="relative";el.style.zIndex="2";if(el.dataset.sw&&src.has(el.closest(".list"))){el.style.zIndex="41";el.style.background="#101010";el.style.borderRadius="14px"}}
    const L=el.parentElement&&el.parentElement.closest(".list");if(L){L.classList.add("flipping");clearTimeout(L._ft);L._ft=setTimeout(()=>L.classList.remove("flipping"),460)}}
  document.body.offsetHeight;
  for(const [el,dy,dh,oh,nh] of moves){
    el.style.transition="transform .38s cubic-bezier(.33,1,.68,1),clip-path .38s cubic-bezier(.33,1,.68,1)";el.style.transform="";if(dh>1)el.style.clipPath="inset(0 0 0 0 round 14px)";
    setTimeout(()=>{el.style.transition="";el.style.willChange="";el.style.clipPath="";el.style.zIndex="";el.style.position="";el.style.background="";el.style.borderRadius=""},450);
  }
}
function animateOut(el,done,mode){
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return done();
  el.classList.add(mode==="undo"?"unchecking":"completing");
  setTimeout(()=>{el.style.height=el.offsetHeight+"px";el.style.overflow="hidden";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add("collapse");el.style.height="0px"}))},430);
  setTimeout(done,800);
}
function markSeg(x,h){const nw=new Date(),d=iso(nw),dur=Math.max(5,Math.round((h||0)*60)),b=nw.getHours()*60+nw.getMinutes();
  // the latest finished task sits right before "now"; earlier ones slide back to make room
  let edge=b-dur;S.tasks.flatMap(t=>(t.segs||[]).filter(g=>g.d===d)).sort((p,q)=>q.b-p.b).forEach(g=>{if(g.b>edge){const len=g.b-g.a;g.b=edge;g.a=Math.max(0,edge-len)}edge=Math.min(edge,g.a)});
  const old=iso(addDays(nw,-60));x.segs=[...(x.segs||[]).filter(g=>g.d>=old),{d,a:Math.max(0,b-dur),b}]}
function unSeg(x){const d=iso(new Date());x.segs=(x.segs||[]).filter(g=>g.d!==d)}
function completeChunk(id,h){const x=S.tasks.find(v=>v.id===id);if(!x)return;vtNext=true;x.doneAt=Date.now();markSeg(x,h||remaining(x));
  if(h){const d=iso(new Date());x.log=x.log||{};x.log[d]=(x.log[d]||0)+h;if(remaining(x)<=0.01)x.done=true}else x.done=true;
  dropExample();commit()}
function pinTo(id,date){const x=S.tasks.find(v=>v.id===id);if(!x)return;vtNext=true;x.pin=date;
  for(const d in S.order||{})S.order[d]=S.order[d].filter(v=>v!==id);dropExample();commit()}
let G=null;
document.addEventListener("pointerdown",e=>{
  if(!$("#scrim").hidden)return;
  const h=e.target.closest("[data-drag]");
  if(h){
    const wrap=h.closest(".swr"),list=wrap.parentElement;
    G={mode:"drag",id:h.dataset.drag,wrap,list,y0:e.clientY,moved:false,over:null};
    h.setPointerCapture(e.pointerId);e.preventDefault();return;
  }
  const sw=e.target.closest(".swr");
  if(!sw||e.target.closest("input,button,.del"))return;
  G={mode:"swipe?",sw,row:sw.querySelector(".row"),x0:e.clientX,y0:e.clientY,dx:0};
});
document.addEventListener("pointermove",e=>{
  if(!G)return;
  if(G.mode==="drag"){
    const dy=e.clientY-G.y0;if(Math.abs(dy)>4)G.moved=true;if(!G.moved)return;
    G.wrap.classList.add("dragging");G.wrap.style.transform=`translateY(${dy}px)`;
    const sibs=[...G.list.querySelectorAll(".swr")].filter(x=>x!==G.wrap);
    let before=null;for(const s2 of sibs){const r=s2.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=s2;break}}
    const rect0=G.wrap.getBoundingClientRect();
    if(before!==G.wrap.nextElementSibling&&!(before===null&&G.wrap===G.list.lastElementChild)){
      G.list.insertBefore(G.wrap,before);const rect1=G.wrap.getBoundingClientRect();G.y0+=rect1.top-rect0.top;
      G.wrap.style.transform=`translateY(${e.clientY-G.y0}px)`;
    }
    const el=document.elementFromPoint(e.clientX,e.clientY),day=el&&el.closest(".day");
    document.querySelectorAll(".day.drop").forEach(d=>d.classList.remove("drop"));
    G.over=day||null;if(day)day.classList.add("drop");
    return;
  }
  const dx=e.clientX-G.x0,dy=e.clientY-G.y0;
  if(G.mode==="swipe?"){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){G=null;return}if(Math.abs(dx)>10)G.mode="swipe";else return}
  G.dx=dx;G.row.style.transform=`translateX(${dx}px)`;G.sw.dataset.dir=dx>0?"r":"l";
  G.sw.classList.toggle("armed",Math.abs(dx)>90);
});
function endGesture(e){
  if(!G)return;const g=G;G=null;
  document.querySelectorAll(".day.drop").forEach(d=>d.classList.remove("drop"));
  if(g.mode==="drag"){
    g.wrap.classList.remove("dragging");g.wrap.style.transform="";
    if(!g.moved)return;quietClick();
    if(g.over){const d=iso(addDays(parse(view.week),+g.over.dataset.day));swiped=true;setTimeout(()=>swiped=false,80);return pinTo(g.id,d)}
    const date=g.list.dataset.date,ids=[...g.list.querySelectorAll(".swr")].map(x=>x.dataset.sw);
    S.order=S.order||{};S.order[date]=ids;
    const x=S.tasks.find(v=>v.id===g.id);if(x&&!x.recId)x.pin=date;
    dropExample();return commit();
  }
  if(g.mode!=="swipe")return;
  quietClick();
  if(Math.abs(g.dx)>90){
    const id=g.sw.dataset.sw;
    g.row.style.transition="transform .18s";g.row.style.transform=`translateX(${g.dx>0?120:-120}%)`;
    setTimeout(()=>{const fin=()=>{if(g.dx>0)completeChunk(id,+g.sw.dataset.h||0);else pinTo(id,iso(addDays(parse(g.sw.dataset.date),1)))};
      if(matchMedia("(prefers-reduced-motion: reduce)").matches)return fin();
      g.sw.style.height=g.sw.offsetHeight+"px";requestAnimationFrame(()=>{g.sw.classList.add("collapse");g.sw.style.height="0px"});setTimeout(fin,300)},170);
  }else{g.row.style.transition="transform .18s";g.row.style.transform="";g.sw.classList.remove("armed");setTimeout(()=>{g.row.style.transition=""},200)}
}
document.addEventListener("pointerup",endGesture);
document.addEventListener("pointercancel",e=>{if(G&&G.mode!=="drag"&&G.row){G.row.style.transform=""}if(G&&G.mode==="drag"){G.wrap.classList.remove("dragging");G.wrap.style.transform=""}G=null});

// ---------- morning brief (first open of the day) ----------
function maybeBrief(){
  const today=iso(new Date());let last=null;
  try{last=localStorage.getItem("miSemanaBrief")}catch(e){}
  if(last===today||!$("#scrim").hidden)return;
  try{localStorage.setItem("miSemanaBrief",today)}catch(e){}
  const items=PL.P[today]||[],load=items.reduce((a,x)=>a+x.h,0);
  const dueToday=S.tasks.filter(t=>!t.done&&t.due===today&&!t.recId).length;
  const overdue=S.tasks.filter(t=>!t.done&&t.due<today&&!t.recId).length;
  const hr=new Date().getHours(),hi=hr<13?"Buenos días":hr<20?"Buenas tardes":"Buenas noches";
  const d=new Date();
  $("#sheet").dataset.kind="brief";
  $("#sheet").innerHTML=`<small class="brief-k">${DAYS_LONG[(d.getDay()+6)%7]} ${d.getDate()}</small><h3>${hi}</h3>
  <p class="brief-sum">${items.length?`Hoy tienes <b>${items.length} ${items.length===1?"tarea":"tareas"}</b>, unas <b>${fmtH(load)}</b> de trabajo.`:"Hoy no tienes tareas pendientes."}${dueToday?` ${dueToday} vence${dueToday>1?"n":""} hoy.`:""}${overdue?` <span class="bad">${overdue} vencida${overdue>1?"s":""}.</span>`:""}</p>
  ${items.length?`<div class="list">${items.slice(0,5).map((x,i)=>`<div class="row"><span class="num-b ${i===0?"first":""}">${i+1}</span><div class="txt"><div class="t">${esc(x.t.title)}</div><div class="s">${fmtH(x.h)}</div></div></div>`).join("")}</div>${items.length>5?`<p class="note">y ${items.length-5} más.</p>`:""}`:""}
  <div class="actions"><button type="button" class="btn" id="briefOk">${items.length?"Empezar":"Vale"}</button></div>`;
  $("#scrim").hidden=false;
}
